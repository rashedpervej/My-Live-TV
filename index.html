<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Live TV Dashboard</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        
        /* Left Column: Button container */
        .left-panel { 
            position: absolute; 
            top: 15px; 
            left: 15px; 
            z-index: 9999; 
            background: rgba(0,0,0,0.7); 
            padding: 12px; 
            border-radius: 8px;
            display: flex;
            flex-direction: column; 
            gap: 10px; 
            max-height: 90vh; 
            overflow-y: auto;  
            border: 1px solid rgba(255,255,255,0.1);
        }

        .channel-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        button { 
            padding: 10px 20px; 
            font-size: 15px; 
            cursor: pointer; 
            border-radius: 5px; 
            background: #ff0000; 
            color: white; 
            border: none; 
            font-weight: bold; 
            text-align: left; 
            width: 140px; 
            transition: all 0.2s ease;
        }
        
        button:hover { background: #cc0000; }
        button.active { background: #008000; } 

        .toggle-btn {
            background: #333;
            border: 1px solid #555;
            text-align: center;
            font-size: 13px;
            padding: 8px 10px;
            margin-top: 5px;
            color: white;
        }
        .toggle-btn:hover { background: #444; }

        /* Right Column Parent Panel */
        .right-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 9999;
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Notice & AI Box Common Style */
        .info-box {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #ff0000;
            border-radius: 6px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .box-header {
            color: #ff0000;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 4px;
            margin-bottom: 8px;
        }

        /* Continuous Text Animation Effect */
        .marquee-box {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            box-sizing: border-box;
        }

        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: marqueeEffect 22s linear infinite;
            color: #fff;
            font-size: 13px;
        }

        @keyframes marqueeEffect {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* AI Output Box Style */
        .ai-content {
            color: #00ffcc;
            font-size: 13px;
            line-height: 1.4;
            min-height: 50px;
        }
        
        .player-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="left-panel">
        <div class="channel-group" id="buttonArea"></div>
        <button class="toggle-btn" onclick="toggleRightPanel()">💬 Widgets: ON</button>
    </div>

    <div class="right-panel" id="rightSidebar">
        <div class="info-box">
            <div class="box-header">🔔 Live Update:</div>
            <div class="marquee-box">
                <div class="marquee-text">Welcome to My Live TV! Stream Online. Keep updating your channel tokens regularly if they expire. Enjoy high quality streaming without buffer.</div>
            </div>
        </div>

        <div class="info-box" style="border-color: #00ffcc;">
            <div class="box-header" style="color: #00ffcc;">🤖 AI Live Summary:</div>
            <div class="ai-content" id="aiSummaryBox">Select a channel to generate live program/match summary updates...</div>
        </div>
    </div>

    <div class="player-container">
        <iframe id="tvPlayer" allow="autoplay; encrypted-media" src=""></iframe>
    </div>

    <script>
        // Apnar API Key ekhane secure bhabe thakbe
        const GEMINI_API_KEY = "AQ.Ab8RN6IfIiz81Y091B9W6JtDr99LxwR86oe1KYgkWcB9NHrwFw";

        // Channel Data List
        const channels = [
           		{
                name: "Asian TV",
                url: "http://172.19.178.39:18190/asian_tv/embed.html?token=5102cdf9a1c1e2b3865dea504e4ee2c5488e855a-c20fda493fcfdb231c748a006ba09d21-1782849380-1782838280&autoplay=false&mute=true"
            },
            	{
                name: "ATN Bangla",
                url: "http://172.19.178.39:18190/atn_bangla/embed.html?token=7a2fb566734a9c3618671ac4e46709f3a61d5cf1-7c820171ae85ce5dae23b5d5621526ef-1782850983-1782839883&autoplay=false&mute=false"
            },
               {
                name: "Deepto TV",
                url: "http://172.19.178.39:18190/deepto_tv/embed.html?token=2114fbc3be4fa23862ffc00ad01f083ea5fdb331-8fe7eb44d44d1971257501e404913553-1782853915-1782842815&autoplay=false&mute=false"
            },
            	{
                name: "GTV",
                url: "http://172.19.178.39:18190/gtv/embed.html?token=7f1966f2ef5728733ffa6be69f2a4474bc9ea3ad-27c2aab8b699b51cad6f558854bc4d56-1782854148-1782843048&autoplay=false&mute=false"
            },

		{
                name: "Machranga",
                url: "http://172.19.178.39:18190/maasranga_hd/embed.html?token=278af1b0cff09b711abf9ca6f425c89100d7ff4c-208ea196df37985db9bfb1447a9f287a-1782854193-1782843093&autoplay=false&mute=false"
            },

		{
                name: "TSports",
                url: "http://172.19.178.49:18190/unite8-sports-2/embed.html?token=3869db869615bc9f05060f3f78075771f7eaadde-ae5d541c30e2620946e507b52fc3c17e-1782854479-1782843379&autoplay=false&mute=false"
            }

       	 ];

        const buttonArea = document.getElementById('buttonArea');
        const tvPlayer = document.getElementById('tvPlayer');

        channels.forEach((channel) => {
            const btn = document.createElement('button');
            btn.innerText = channel.name;
            btn.onclick = function() {
                document.querySelectorAll('.channel-group button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tvPlayer.src = channel.url;
                
                getAiSummary(channel.name);
            };
            buttonArea.appendChild(btn);
        });

        // Vercel/HTTPS fully compatible Gemini API request function
        async function getAiSummary(channelName) {
            const aiBox = document.getElementById('aiSummaryBox');
            aiBox.innerHTML = "⏳ <i>AI is scanning current schedule & updates...</i>";

            const prompt = `Give a very brief current program guide, live match preview, or active tournament standings/news for the TV channel: "${channelName}". If it is a sports channel (like T Sports), focus on current major live tournaments or match context. Keep the output maximum 2-3 lines, highly engaging, clean text, and informal.`;

            try {
                // HTTPS endpoint standard path call
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                
                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiResponseText = data.candidates[0].content.parts[0].text;
                    aiBox.innerText = aiResponseText;
                } else {
                    aiBox.innerText = "⚠️ AI Response error. Try again.";
                }
            } catch (error) {
                console.error(error);
                aiBox.innerText = "⚠️ Failed to fetch live AI summary. Check network or key.";
            }
        }

        function toggleRightPanel() {
            const sidebar = document.getElementById('rightSidebar');
            const toggleBtn = document.querySelector('.toggle-btn');
            
            if (sidebar.style.display === 'none') {
                sidebar.style.display = 'flex';
                toggleBtn.innerText = "💬 Widgets: ON";
                toggleBtn.style.background = "#333";
            } else {
                sidebar.style.display = 'none';
                toggleBtn.innerText = "🔇 Widgets: OFF";
                toggleBtn.style.background = "#552222";
            }
        }
    </script>
</body>
</html>
